<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astraea Attendance</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header id="header">
        <h1>Astraea Attendance</h1>
    </header>
    <main>
        <section>
            <h2>Scan your ID</h2>
            <p>Show the barcode on your ID to the webcam</p>
            <video id="webcam" autoplay></video>
        </section>
        <section>
            <h2>Manually Enter Id</h2>
            <p>Looks like someone forgot their ID card...</p>
            <input id="student-id-entry" placeholder="Enter your ID #">
            <button id="submit-id">Submit</button>
            <p id="status-manual-entry"></p>
        </section>
        <section>
            <h2>Recently Checked In</h2>
            <ul id="recent-checkins"></ul>
        </section>
    </main>
    <script type="module" src="./src/client/app.js"></script>
</body>
